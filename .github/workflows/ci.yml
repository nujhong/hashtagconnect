name: Check

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          require-lockfile: true
          cache: true
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
